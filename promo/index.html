<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>OhGithubLost · Promo · M3 Cut</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         Material Design 3 · 设计令牌（单一来源）
         - 色彩：M3 角色（surface container 五级 / primary / tertiary / outline）
         - 字型：M3 15 档 type scale 中实际用到的 8 档，Roboto 为主，数据用等宽
         - 形状：M3 corner scale（none 0 / xs 4 / sm 8 / md 12 / lg 16 / xl 28 / full）
         - 高度：M3 tonal elevation（surface-container 分级，不用阴影堆叠）
         - 间距：8dp 网格
         ========================================================================== */
      :root {
        /* --- color roles (dark scheme, seed #0969DA) --- */
        --md-surface: #10141a;
        --md-surface-dim: #0b0e12;
        --md-surface-bright: #363a40;
        --md-surface-container-lowest: #0b0e12;
        --md-surface-container-low: #181c22;
        --md-surface-container: #1c2026;
        --md-surface-container-high: #262a30;
        --md-surface-container-highest: #31353b;
        --md-on-surface: #e3e2e6;
        --md-on-surface-variant: #c3c7cf;
        --md-outline: #8d9199;
        --md-outline-variant: #44474e;
        --md-primary: #a9c7ff;
        --md-on-primary: #00325a;
        --md-primary-container: #0b4a87;
        --md-on-primary-container: #d6e3ff;
        --md-secondary: #bdc7dc;
        --md-on-secondary: #273141;
        --md-secondary-container: #3e4759;
        --md-tertiary: #e3b341;
        --md-on-tertiary: #402d00;
        --md-error: #ffb4ab;
        --md-on-error: #690005;

        /* --- shape scale --- */
        --md-shape-none: 0px;
        --md-shape-xs: 4px;
        --md-shape-sm: 8px;
        --md-shape-md: 12px;
        --md-shape-lg: 16px;
        --md-shape-xl: 28px;
        --md-shape-full: 9999px;

        /* --- type scale（1920x1080 舞台按 1.7x 放大，比例不变） --- */
        --md-display-large: 96px;
        --md-headline-large: 56px;
        --md-headline-medium: 44px;
        --md-title-large: 32px;
        --md-title-medium: 26px;
        --md-body-large: 24px;
        --md-body-medium: 22px;
        --md-label-large: 22px;
        --md-label-medium: 20px;

        /* --- 8dp 网格 --- */
        --md-space-1: 8px;
        --md-space-2: 16px;
        --md-space-3: 24px;
        --md-space-4: 32px;
        --md-space-6: 48px;
        --md-space-8: 64px;
        --md-space-12: 96px;

        --md-font: "Roboto", sans-serif;
        --md-mono: "OGL-Mono", ui-monospace, monospace;
      }

      @font-face {
        font-family: "OGL-Mono";
        src: url("assets/fonts/UbuntuMono-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "OGL-Mono";
        src: url("assets/fonts/UbuntuMono-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: block;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; margin: 0;
        overflow: hidden; background: var(--md-surface);
        color: var(--md-on-surface); font-family: var(--md-font);
        -webkit-font-smoothing: antialiased;
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--md-surface); }
      .clip { position: absolute; }
      .scene-host { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      /* --- M3 type styles --- */
      .type-display { font-size: var(--md-display-large); font-weight: 400; line-height: 1.08; letter-spacing: -0.25px; }
      .type-headline { font-size: var(--md-headline-large); font-weight: 400; line-height: 1.14; letter-spacing: 0; }
      .type-title { font-size: var(--md-title-large); font-weight: 400; line-height: 1.25; letter-spacing: 0; }
      .type-title-m { font-size: var(--md-title-medium); font-weight: 500; line-height: 1.3; letter-spacing: 0.15px; }
      .type-body { font-size: var(--md-body-large); font-weight: 400; line-height: 1.5; letter-spacing: 0.5px; }
      .type-body-m { font-size: var(--md-body-medium); font-weight: 400; line-height: 1.45; letter-spacing: 0.25px; }
      .type-label { font-size: var(--md-label-large); font-weight: 500; line-height: 1.27; letter-spacing: 0.1px; }
      .type-label-m { font-size: var(--md-label-medium); font-weight: 500; line-height: 1.33; letter-spacing: 0.5px; }

      .on-variant { color: var(--md-on-surface-variant); }
      .primary { color: var(--md-primary); }
      .tertiary { color: var(--md-tertiary); }
      .error { color: var(--md-error); }

      /* --- M3 surfaces --- */
      .surface-1 { background: var(--md-surface-container-low); }
      .surface-2 { background: var(--md-surface-container); }
      .surface-3 { background: var(--md-surface-container-high); }
      .surface-4 { background: var(--md-surface-container-highest); }
      .outlined { border: 1px solid var(--md-outline-variant); }
      .filled-card { background: var(--md-surface-container-high); border-radius: var(--md-shape-md); }
      .elevated-card {
        background: var(--md-surface-container-low);
        border-radius: var(--md-shape-md);
        border: 1px solid var(--md-outline-variant);
      }
      .divider { height: 1px; background: var(--md-outline-variant); }

      /* --- M3 chips（小圆角 8，不用胶囊化一切） --- */
      .chip {
        display: inline-flex; align-items: center; gap: 8px;
        height: 40px; padding: 0 16px;
        border-radius: var(--md-shape-sm);
        border: 1px solid var(--md-outline-variant);
        background: transparent;
        color: var(--md-on-surface-variant);
        font-size: var(--md-label-large); font-weight: 500; letter-spacing: 0.1px;
      }
      .chip.assist { background: var(--md-surface-container-high); border-color: transparent; color: var(--md-on-surface); }
      .status-dot { width: 8px; height: 8px; border-radius: var(--md-shape-full); background: var(--md-primary); }

      /* --- 实机截图取景框：M3 small(8) + outline-variant --- */
      .shot {
        position: absolute;
        object-fit: cover;
        border-radius: var(--md-shape-sm);
        border: 1px solid var(--md-outline-variant);
        background: var(--md-surface-container-lowest);
      }

      /* --- 全片覆盖层 --- */
      #beat-flash {
        position: absolute; inset: 0; pointer-events: none; z-index: 89;
        background: var(--md-primary);
        opacity: 0;
      }
      #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 90;
        background: radial-gradient(ellipse 82% 74% at 50% 46%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.30) 100%);
      }
      #grain {
        position: absolute; inset: 0; pointer-events: none; z-index: 91;
        opacity: 0.03;
        background-image: repeating-linear-gradient(0deg,
          rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 1px,
          transparent 1px, transparent 3px);
      }
    </style>

  <body>
    <div id="root"
         data-composition-id="main"

      <div id="s1-hook" class="clip scene-host"

           data-composition-src="compositions/s1-hook.html"

      <!-- 主音轨：HOYO-MiX《子不语 Wordless》28–84s 裁段（56s，44.1k AAC/MP3）。
           版权归原权利人；仅随 video 分支用于本次内部样片评估，正式发布前须确认授权或切回合成轨。 -->
      <audio id="bgm" src="assets/audio/wordless-56s.mp3"
             data-start="0" data-duration="56" data-track-index="9" data-volume="0.92"></audio>
      <!-- 合成 BGM 备用轨（volume 0，不参与混音） -->
      <audio id="bgm-fallback" src="assets/audio/bgm.wav"
             data-start="0" data-duration="56" data-track-index="10" data-volume="0"></audio>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      /* M3 状态层式卡点：弱拍用 8% primary 覆盖，强拍 16%，无缩放抖动 */
      const weak = [6.8, 14.1, 23.0, 32.2];
      const strong = [40.2, 46.2, 52.3];
      weak.forEach(function (t) {
        tl.fromTo("#beat-flash", { opacity: 0 },
          { opacity: 0.08, duration: 0.08, ease: "power2.out", immediateRender: false }, t);
        tl.to("#beat-flash", { opacity: 0, duration: 0.30, ease: "power2.in" }, t + 0.08);
      });
      strong.forEach(function (t) {
        tl.fromTo("#beat-flash", { opacity: 0 },
          { opacity: 0.16, duration: 0.06, ease: "power2.out", immediateRender: false }, t);
        tl.to("#beat-flash", { opacity: 0, duration: 0.22, ease: "power2.in" }, t + 0.06);
      });
      window.__timelines["main"] = tl;
    </script>
