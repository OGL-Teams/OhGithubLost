<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>OhGithubLost · Promo · Wordless Cut</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0d1117;
        --panel: #161b22;
        --ink: #e6edf3;
        --muted: #8b949e;
        --brand: #0969da;
        --accent: #e3b341;
        --ok: #3fb950;
        --bad: #f85149;
        --font-display: "Inter", sans-serif;
        --font-mono: "OGL-Mono", monospace;
      }
      @font-face {
        font-family: "OGL-Mono";
        src: url("assets/fonts/UbuntuMono-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "OGL-Mono";
        src: url("assets/fonts/UbuntuMono-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; margin: 0;
        overflow: hidden; background: var(--ground);
        color: var(--ink); font-family: var(--font-display);
      }
      #root {
        position: relative; width: 100%; height: 100%;
        overflow: hidden; background: var(--ground);
      }
      .clip { position: absolute; }
      .scene-host {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
      }
      #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 90;
        background: radial-gradient(ellipse 78% 68% at 50% 46%,
                    rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%);
      }
      #grain {
        position: absolute; inset: 0; pointer-events: none; z-index: 91;
        opacity: 0.045;
        background-image: repeating-linear-gradient(
          0deg, rgba(255,255,255,0.35) 0px, rgba(255,255,255,0.35) 1px,
          transparent 1px, transparent 3px);
      }
      /* 卡点闪层：只在 7 个真实 onset 上出现，确定性 */
      #beat-flash {
        position: absolute; inset: 0; pointer-events: none; z-index: 89;
        background: radial-gradient(ellipse 60% 55% at 50% 50%,
                    rgba(88,166,255,0.34) 0%, rgba(9,105,218,0.08) 46%, rgba(0,0,0,0) 75%);
        opacity: 0;
      }
      /* 实机截图共用的取景框（由各场景自行摆放） */
      .shot {
        position: absolute;
        object-fit: cover;
        border-radius: 22px;
        border: 1px solid rgba(139,148,158,0.30);
        box-shadow: 0 30px 90px rgba(0,0,0,0.55);
      }
      .mono { font-family: var(--font-mono); }
      .kicker {
        font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.22em;
        color: var(--brand); text-transform: uppercase;
      }
      .h1 { font-size: 108px; font-weight: 650; letter-spacing: -0.045em; line-height: 1.06; }
      .h2 { font-size: 72px; font-weight: 650; letter-spacing: -0.035em; line-height: 1.1; }
      .sub { font-size: 30px; color: var(--muted); letter-spacing: 0.01em; }
      .accent { color: var(--accent); }
      .brand { color: #58a6ff; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .card {
        background: linear-gradient(160deg, rgba(28,35,46,0.96), rgba(19,25,34,0.96));
        border: 1px solid rgba(139,148,158,0.22);
        border-radius: 20px;
        box-shadow: 0 24px 70px rgba(0,0,0,0.42);
      }
      .pill {
        display: inline-flex; align-items: center; gap: 12px;
        padding: 10px 20px; border-radius: 999px;
        border: 1px solid rgba(139,148,158,0.28);
        background: rgba(22,27,34,0.9);
        font-family: var(--font-mono); font-size: 22px; color: var(--ink);
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
      .grid-bg {
        background-image:
          linear-gradient(rgba(88,166,255,0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(88,166,255,0.055) 1px, transparent 1px);
        background-size: 64px 64px;
      }
      .hair { height: 1px; background: rgba(139,148,158,0.22); }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0" data-duration="56"
         data-width="1920" data-height="1080"
         data-composition-variables='[{"id":"product","type":"string","label":"Product","default":"OhGithubLost"},{"id":"tagline","type":"string","label":"Tagline","default":"不折腾 · 装上就能用"},{"id":"cta","type":"string","label":"CTA","default":"搜 OhGithubLost · 下载即用"}]'>

      <!-- 切点来自 Wordless 真实 onset：0 / 6.8 / 14.1 / 23.0 / 32.2 / 40.2 / 46.2 / 52.3 / 56 -->
      <div id="s1-hook" class="clip scene-host"
           data-composition-id="s1-hook"
           data-composition-src="compositions/s1-hook.html"
           data-start="0" data-duration="6.8" data-track-index="1"
           data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="s2-repo" class="clip scene-host"
           data-composition-id="s2-repo"
           data-composition-src="compositions/s2-repo.html"
           data-start="6.8" data-duration="7.3" data-track-index="1"
           data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="s3-collab" class="clip scene-host"
           data-composition-id="s3-collab"
           data-composition-src="compositions/s3-collab.html"
           data-start="14.1" data-duration="8.9" data-track-index="1"
           data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="s4-layers" class="clip scene-host"
           data-composition-id="s4-layers"
           data-composition-src="compositions/s4-layers.html"
           data-start="23.0" data-duration="9.2" data-track-index="1"
           data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="s5-trust" class="clip scene-host"
           data-composition-id="s5-trust"
           data-composition-src="compositions/s5-trust.html"
           data-start="32.2" data-duration="8.0" data-track-index="1"
           data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="s6-i18n" class="clip scene-host"
           data-composition-id="s6-i18n"
           data-composition-src="compositions/s6-i18n.html"
           data-start="40.2" data-duration="6.0" data-track-index="1"
           data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="s7-platforms" class="clip scene-host"
           data-composition-id="s7-platforms"
           data-composition-src="compositions/s7-platforms.html"
           data-start="46.2" data-duration="6.1" data-track-index="1"
           data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="s8-end" class="clip scene-host"
           data-composition-id="s8-end"
           data-composition-src="compositions/s8-end.html"
           data-start="52.3" data-duration="3.7" data-track-index="1"
           data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="beat-flash" class="clip" data-start="0" data-duration="56" data-track-index="7"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="56" data-track-index="8"></div>
      <div id="grain" class="clip" data-start="0" data-duration="56" data-track-index="8"></div>

      <!-- 主音轨：HOYO-MiX《子不语 Wordless》(28–84s 裁段，56s)。
           原曲为 FLAC-in-mp3 容器，转成 44.1k AAC/MP3 供浏览器稳定解码。
           版权归原作者所有；此文件仅随 video 分支用于本次宣传片样片。 -->
      <audio id="bgm" src="assets/audio/wordless-56s.mp3"
             data-start="0" data-duration="56" data-track-index="9" data-volume="0.92"></audio>
      <!-- 合成 BGM 保留为可选备用轨，默认静音（data-volume=0），不参与混音 -->
      <audio id="bgm-fallback" src="assets/audio/bgm.wav"
             data-start="0" data-duration="56" data-track-index="10" data-volume="0"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // 根时间线只负责 7 个卡点闪层；子场景由 runtime 各自 seek。
      const tl = gsap.timeline({ paused: true });
      const cuts = [0, 6.8, 14.1, 23.0, 32.2, 40.2, 46.2, 52.3];
      cuts.slice(1).forEach(function (t) {
        tl.fromTo("#beat-flash", { opacity: 0 },
          { opacity: 0.55, duration: 0.07, ease: "power2.out" }, t);
        tl.to("#beat-flash", { opacity: 0, duration: 0.24, ease: "power2.in" }, t + 0.07);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
