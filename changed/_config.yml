# OGL 更新日志站点 · Jekyll 配置
# 由 GitHub Pages 原生构建，推送本目录即自动发布。

title: OhGithubLost 更新日志
description: >-
  记录 OhGithubLost（一款 GitHub 仓库管理客户端）每个版本的变化，
  并提供各版本安装包的下载。
baseurl: ""            # 项目 Pages 子路径（<user>.github.io/<repo>/ 时填 /<repo>）
url: ""                # 生产域名（Pages 自动注入）

# 主题：Cayman（现代简洁的文档主题，适合按时间排列的更新日志）
theme: jekyll-theme-cayman

# 站点结构：将 release_notes/ 的版本说明复制为 _posts（见生成脚本）
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: OGL

# 排序：新版本在前
future: false
show_excerpts: false

# 不发布的内容
exclude:
  - README.md
  - generate_posts.py
  # Gemfile 仅用于 Netlify 构建期解析依赖，不属于站点内容
  - Gemfile
  - Gemfile.lock
  - vendor
  - "*.sh"
