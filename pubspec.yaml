# ============================================================================
# OhGithubLost（OGL）· 项目依赖清单
#
# 依赖削减原则（保守重写后）：
#   - 展示层（surface）不再引入任何"视觉框架"依赖，
#     页面一律直接使用 Flutter 自带 Material 3 组件；
#   - 只保留"真的被 import 到"的包（由 CI 静态检查兜底）。
#
# 架构分层映射：
#   kernel/boot   → cryptography（Ed25519 引导清单签名校验）
#   base/net      → package:http 的 BrowserClient（浏览器传输引擎：超时 / 重定向）
#   base/disk     → crypto（SHA256 摘要）· Web 侧存储零外部依赖（localStorage + 内存文件表）
#   surface/readme → flutter_markdown（README / 正文渲染）
#   surface/util   → url_launcher（外链打开）
# ============================================================================

name: ohgithublost
description: "OGL · OhGithubLost — GitHub 仓库管理器（Flutter 多平台重构版）"
publish_to: 'none'
version: 8.0.0+80000

homepage: https://github.com/OGL-Teams/OhGithubLost
repository: https://github.com/OGL-Teams/OhGithubLost
issue_tracker: https://github.com/OGL-Teams/OhGithubLost/issues

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # ── 本地化（长按菜单 / 系统组件文案中文化）──────────────────────────
  flutter_localizations:
    sdk: flutter

  # ── 底座 · 网络连接 ─────────────────────────────────────────────────
  # 传输层：**Web 用 package:http 的 BrowserClient** —— 浏览器里没有 dart:io，
  # 而 http 是纯 Dart 且自带浏览器实现（fetch/XHR）。
  # 本分支为纯 Web 构建：这是唯一的传输实现（`web_net_transport.dart`）。
  http: ^1.2.2

  # ── 底座 · 硬盘逻辑 ─────────────────────────────────────────────────
  # 浏览器里没有文件系统与系统密钥库：目录规划 / KV / 文件表由
  # `platform_web_impl.dart`（localStorage + 内存文件表）承担；
  # path_provider / flutter_secure_storage 已随原生侧实现一并移除。
  crypto: ^3.0.7                   # SHA256 等摘要

  # ── 启动层 · 信任校验 ───────────────────────────────────────────────
  cryptography: ^2.9.0             # Ed25519 引导清单签名验证

  # ── 展示层 · 渲染与外链 ─────────────────────────────────────────────
  flutter_markdown: ^0.7.7+1       # README / 议题 / 评论渲染
  url_launcher: ^6.3.2             # 外链 / 打开文件

  # ── 展示层 · 矢量图预览（SVG）───────────────────────────────────────
  # 只有 SVG 需要它：位图直接用 Flutter 自带的 Image，XML 走 re_highlight 的
  # 语法高亮即可，音频交给系统播放器（见 file_preview.dart 的说明）。
  # 纯 Dart 实现（底层是 vector_graphics），不引入原生代码，
  # 因此不会给九条构建腿增添平台依赖。
  flutter_svg: ^2.0.0

  # ── 展示层 · 代码编辑与高亮（**成熟库**）──────────────────────────────
  # 编辑器内核：行号 / 查找替换 / 撤销重做 / 折叠 / 快捷键 / 大文本；
  # 语法高亮：highlight.js 的 Dart 移植（近百种语言与主题）。
  # 此前这两块都是本项目自研（自写词法器 + 自写查找替换 + 叠加图层编辑区）。
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  # ── 展示层 · 权限（真实系统请求）────────────────────────────────────
  # 成熟库：运行时权限弹窗 + 各平台正确的系统设置入口（Android/iOS/macOS）。
  # 注：permission_handler_android 要求宿主 compileSdk 高于 Flutter 默认值，
  #    构建期由 tool/platform_spec.yaml 声明并在构建期注入（见 build.yml）。
  permission_handler: ^13.0.2

  # ── 展示层 · 桌面窗口（自绘标题栏 / 原生标题 / 可回退系统装饰）────────
  # 仅桌面（Windows / Linux / macOS）生效；移动端不参与。
  # 注：本分支保留 —— `window_windows/linux/macos.dart` 与 `platform.dart`
  #     的枚举仍在（保持 switch 穷尽），它们仍 import 本包。
  window_manager: ^0.5.2
  # ── 中枢层 · 下载与二进制 ───────────────────────────────────────────
  # 下载交给浏览器（`ix_download_backend_web.dart`）：原 background_downloader
  # （Android/iOS 后台下载）已随原生侧实现移除；SAF 同理（浏览器没有 SAF，
  # saf_util / saf_stream 一并移除，落盘档位恒为 `internal`）。
  archive: ^3.6.1                   # Actions 日志 zip 解压
  # ── 展示层 · 系统级通知 ─────────────────────────────────────────────
  # 后台时的"系统通知"通道（下载完成 / 任务结束 / 严重错误）。
  # 注：Android 需要 core library desugaring，构建期由
  #     tool/platform_spec.yaml 声明并在构建期注入（见 build.yml）。
  flutter_local_notifications: ^22.3.1
  # ── 中枢层 · 工作流参数解析 ─────────────────────────────────────────
  # 手动触发工作流前，从 `.github/workflows/*.yml` 解析 `on.workflow_dispatch.inputs`
  # （必选参数 / 默认值 / 选项），据此生成表单。纯 Dart，无平台依赖。
  yaml: ^3.1.2

  # 已移除（未被任何代码 import，重写时一并裁掉）：
  #   provider · shared_preferences · file_picker
  #   cached_network_image · mocktail
  #
  # v7.2.1（Web 分支）随原生侧实现一并移除（经 lib/ 全量 rg 确认零引用）：
  #   saf_util · saf_stream · background_downloader
  #   path_provider · flutter_secure_storage
  #
  # 仍被保留文件 import、故保留（不随本分支删除）：
  #   window_manager · permission_handler · flutter_local_notifications
  #
  # 注意：device_info_plus **暂不引入**（iOS 构建链报 NSProcessInfo 选择器缺失），
  # 真机探针需要时再选与构建链兼容的版本。

# 注：原 `dependency_overrides: connectivity_plus: 6.1.4`（为 background_downloader
# 固定版本）已随 background_downloader 的移除一并删除（connectivity_plus 零引用）。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ── 依赖覆盖：为 dart2wasm 打通被 transitive dep 卡住的链路 ───────────────
# 问题链：re_editor → isolate_manager ^4.1.5+1 → isolate_contactor ^4.0.0
#   isolate_contactor 4.1.0 的 Web 实现（isolate_contactor_web.dart）import
#   `dart:html`，而 **dart2wasm 不支持 dart:html**（只支持 package:web +
#   dart:js_interop）→ `flutter build web --wasm` 直接编译失败。
#
# 为什么不能只把 isolate_contactor 抬到 4.2.0：4.2.0 虽已迁到 package:web，
#   但它约束 `web: ^0.5.1`（0.x 的 caret 锁死 minor → 实际要 <0.6.0），
#   而本项目 `http 1.x` 需要 `web: ^1.0.0` → 直接冲突，pub 只能退回 4.1.0。
#
# 修法：把 isolate_manager 覆盖到 6.x ——
#   · 6.x 已**彻底删除** isolate_contactor 依赖，自身直接用 `package:web`
#     （约束 `web: ^1.0.0`，与 http 1.x 相容）；
#   · 对外 API 与 re_editor 的用法完全一致：
#       IsolateManager.create(fn, concurrent: n) / .compute(p, callback:) / .stop()
#   · 经核验，6.x 的 lib/ 内**零** `dart:html` 引用。
# 覆盖只影响版本求解，不修改任何第三方源码；re_editor 无需改动。
dependency_overrides:
  isolate_manager: ^6.3.2

flutter:
  uses-material-design: true

  # ── 唯一声明的外部资源：i18n 语言包 ────────────────────────────────────
  # 例外说明：产品要求"界面语言由 JSON 分片维护"，因此这里**只**声明
  # assets/i18n 下的语言 JSON；其余（图标/主题/引导清单）仍全部由框架字形与
  # 代码生成，仓库不引入其它资源文件。
  # 目录按语言分别声明：Flutter 只会把声明到的目录打进包。
  #
  # ★ 本清单必须与 `OgLI18n.locales`（lib/surface/i18n/og_l_i18n.dart）逐项一致。
  #   两边不一致会分别造成两种故障：这里多声明 → 构建期资源缺失报错；
  #   这里少声明 → 运行时该语言全是键名。v6.4.0 由 15 种收敛为 6 种时，
  #   语言目录删了而这里没同步，正是第一种故障。
  assets:
    # ★ 许可全文必须**随程序分发**：Apache-2.0 第 4 条要求随分发提供
    #   许可副本，并在存在 NOTICE 文件时一并提供。
    #   此前本项目用 AGPL-3.0，而其全文只在源码仓库里、构建产物中完全没有，
    #   严格说并不满足「提供副本」的要求；换用 Apache-2.0 后一并修正。
    - LICENSE
    # Apache-2.0 第 4(d) 条：存在 NOTICE 文件时必须一并随分发提供。
    - NOTICE
    - assets/i18n/zh/
    - assets/i18n/zh_TW/
    - assets/i18n/en/
    - assets/i18n/fr/
    - assets/i18n/de/
    - assets/i18n/ru/
