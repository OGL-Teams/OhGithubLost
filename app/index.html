<!DOCTYPE html>
<!--
  OGL Web · 入口页（**自动生成，请勿手改** —— 见 tool/web_publish.py）。

  作用：把当前版本的应用包在 iframe 里，使根地址长期不变、各版本目录并存。
  版式按屏幕自适应：iframe 占满可视区域（含移动端安全区）。
  加载期间显示进度条（loading → loaded 淡出）。
-->
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：让内容铺到刘海/圆角屏的安全区，再由 CSS 的 env() 让出边距 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OhGithubLost · Web</title>
  <meta name="theme-color" content="#171A21">
  <link rel="icon" type="image/png" href="741/favicon.png">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --ink: #E6EDF3;
      --panel: #1E222B;
      --line: #454B5A;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #171A21; color: var(--ink);
      font: 13px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }
    #app {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%; height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #171A21;
    }
    /* 加载进度条：iframe 加载中显示，onload 后淡出 */
    #loader {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 99;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      background: #171A21;
      transition: opacity 0.4s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader .logo {
      font: 600 22px system-ui, sans-serif;
      color: #E6EDF3;
      letter-spacing: 1px;
    }
    #loader .bar {
      width: min(240px, 60vw);
      height: 3px;
      background: #2F3441;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    #loader .bar::after {
      content: '';
      position: absolute;
      top: 0; left: -60%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, #4B9FFF, transparent);
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0% { left: -60%; }
      100% { left: 100%; }
    }
    #loader .hint {
      font: 12px system-ui, sans-serif;
      color: #454B5A;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo">OGL</div>
    <div class="bar"></div>
    <div class="hint">加载中…</div>
  </div>
  <iframe id="app" src="741/" title="OhGithubLost" allow="clipboard-write; fullscreen"></iframe>
  <script>
    (function () {
      var loader = document.getElementById('loader');
      var frame = document.getElementById('app');
      // iframe onload = HTML 文档已加载完成（Flutter 引擎还在初始化，但基础资源没有 404）
      frame.addEventListener('load', function () {
        loader.classList.add('hidden');
        setTimeout(function () { loader.style.display = 'none'; }, 500);
      });
      // 超时兜底：20 秒后也淡出（不让进度条永远卡着）
      setTimeout(function () {
        loader.classList.add('hidden');
        setTimeout(function () { loader.style.display = 'none'; }, 500);
      }, 20000);
    })();
  </script>
</body>
</html>
