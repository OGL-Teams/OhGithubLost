name: CI

# 质量门：静态分析 + 单元测试
# 任何 push / PR / 手动触发都会执行；CI 未通过禁止合入。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ★ 严格模式（2026-11-07）：所有审计步骤继续执行，失败全部收集，最后统一 fail。
# 旧版某一步 fail 后后续步骤全部跳过，一次只暴露一个错误——
# 现在每步都跑完，报告里能看到全部问题，修复者一次改完而不是挤牙膏。
jobs:
  quality:
    name: 质量门（analyze + test）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # ★ 缓存依赖解析结果（2026-11-10 加）：CI 实测总 96s，其中
      #   「静态分析」15s +「单元测试」40s 占 55s。两次运行之间 pubspec
      #   往往没变，.dart_tool/package_config.json 可直接复用，
      #   省掉依赖树的重复解析（多语言分片多时这一项并不便宜）。
      - name: 缓存依赖解析结果（.dart_tool）
        uses: actions/cache@v4
        with:
          path: .dart_tool/package_config.json
          key: pubspec-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pubspec-

      - name: 环境信息
        run: flutter --version

      - name: 获取依赖
        # ★ 严格模式：pub get 失败（pub.dev 网络瞬态等）也算一项失败，
        #   写入汇总文件让终审如实列出；否则前置步骤红了、后续 always()
        #   审计用旧依赖缓存照跑全绿，终审却报「全部审计通过」——自相矛盾。
        run: >-
          flutter pub get || echo "FAIL: flutter pub get（依赖解析失败，多为 pub.dev 网络瞬态；重跑即可）" >> /tmp/strict_failures.txt
        if: always()

      # ── 审计段：每步失败只记录（|| echo），不中断后续；终审统一 fail ──

      # 结构与多语言审计：把「四层依赖方向」「界面文案是否全部本地化」
      # 变成**可执行的门禁**（违反即失败），而不是只写在文档里靠人记。
      - name: 分层审计（依赖只能向下）
        run: >-
          python3 tool/layer_audit.py --fatal || echo "FAIL: layer_audit" >> /tmp/strict_failures.txt
        if: always()

      # ★ 批次 1/2 C 视角共同点名：三支旧门禁只扫 lib/surface、不解析
      #   export、不查文件头与平台门面。补一支覆盖 lib/base / lib/domain
      #   的结构契约审计，同类滞后以后自动暴露。
      - name: 结构契约审计（export / 层级头 / 平台门面 / 文档引用）
        run: >-
          python3 tool/contract_audit.py --fatal || echo "FAIL: contract_audit" >> /tmp/strict_failures.txt
        if: always()

      # 版本一致性：`lib/main.dart` 的 kOgLAppVersion 必须与 pubspec 一致。
      # 历史上它长期停留在 7.4.0 而 pubspec 已到 9.x ——「关于」页与诊断日志
      # 谎报版本，构建与发布流程却浑然不知。这条门禁杜绝复发。
      - name: 门禁之门禁（错误 CWD 下仍有效 + 反向验证）
        # ★ 批 9 交叉 X-01：layer_audit / i18n_scan 曾依赖 CWD，
        #   在 /tmp 下跑会「0 文件 → 0 违规 → 通过」。这一步把
        #   「每支门禁确实扫到了东西」和「能拦下注入缺陷」钉成契约。
        run: >-
          python3 tool/gate_of_gates.py --fatal || echo "FAIL: gate_of_gates" >> /tmp/strict_failures.txt
        if: always()

      - name: 门面类型面审计（export / 桥字段不得扩散实现类）
        run: >-
          python3 tool/facade_audit.py --fatal || echo "FAIL: facade_audit" >> /tmp/strict_failures.txt
        if: always()

      - name: Action 版本守卫（禁浮动分支 / 基线锁定）
        run: >-
          python3 tool/action_pin_audit.py --fatal || echo "FAIL: action_pin_audit" >> /tmp/strict_failures.txt
        if: always()

      - name: 动效档位覆盖守卫（B9 静态部分）
        run: >-
          python3 tool/motion_coverage_audit.py --fatal || echo "FAIL: motion_coverage_audit" >> /tmp/strict_failures.txt
        if: always()

      - name: CI 配置自检（缓存键 / 路径 / 并行压缩）
        # ★ 自检依赖 PyYAML：runner 通常预装，但不作假设 —— 缺则显式补装，
        #   避免「新加的门禁自己因为环境缺包而误红」。
        run: >-
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml;
          python3 tool/ci_config_audit.py --fatal || echo "FAIL: ci_config_audit" >> /tmp/strict_failures.txt
        if: always()

      - name: 版本一致性审计（main.dart 与 pubspec 对齐）
        run: >-
          python3 tool/version_sync.py || echo "FAIL: version_sync" >> /tmp/strict_failures.txt
        if: always()

      - name: i18n 审计（界面文案 0 遗漏 / 分片键集合一致）
        run: >-
          python3 tool/i18n_scan.py --check || echo "FAIL: i18n_scan" >> /tmp/strict_failures.txt
        if: always()

      - name: 动效分级审计（动画必须听档位质量表）
        run: >-
          python3 tool/motion_audit.py --fatal || echo "FAIL: motion_audit" >> /tmp/strict_failures.txt
        if: always()

      # ★ UI 细节度门禁：设计令牌之外的字面值一律拦下。
      #   防的是「卡片圆角 2/6/8/12/24 并存」「间距 10/20/28 散落」
      #   「同一角色按钮两处圆角不同」这类**编译器不会报错**的问题。
      - name: UI 细节度门禁（设计令牌一致性）
        run: >-
          python3 tool/ui_audit.py --fatal || echo "FAIL: ui_audit" >> /tmp/strict_failures.txt
        if: always()

      - name: 性能反模式审计（shrinkWrap / 宽 MediaQuery.of）
        run: >-
          python3 tool/perf_audit.py --fatal || echo "FAIL: perf_audit" >> /tmp/strict_failures.txt
        if: always()

      - name: 图表自检（统计曲线的坐标系 / 刻度 / 降采样）
        run: >-
          python3 tool/stats_chart.py --selftest || echo "FAIL: stats_chart" >> /tmp/strict_failures.txt
        if: always()

      # 平台私有文件注入器自检：必须在 CI 里守住"注入不是逃生舱"这条纪律
      # （缺 `why` 的注入项会被拒绝；幂等性也在此验证）。
      - name: 平台注入器自检（幂等 / 缺 why 拒绝）
        run: >-
          python3 tool/inject_platform_spec_selftest.py || echo "FAIL: inject_platform_spec_selftest" >> /tmp/strict_failures.txt
        if: always()

      # 格式护栏：修「fork 那份 diff 78% 文件被触碰、53% 是空白漂移」类问题。
      # 必须在 analyze 之前跑——空行/缩进不统一会让后续 review 全是噪音。
      # 用 CI 镜像里自带的 `dart format --set-exit-if-changed`（不读
      # `analysis_options.yaml`，避免 flutter_lints 解析失败误杀）。
      # 范围 `lib test`：源码 + widget 测试都要格式化一致。
      - name: 格式护栏（dart format）
        run: >-
          dart format --language-version=3.6 --set-exit-if-changed --output=none lib test || echo "FAIL: dart format" >> /tmp/strict_failures.txt
        if: always()

      # ── C-12：import 规范化纳入门禁（有工具无门禁 → 严格模式步）。
      #   --dry-run = --check：检测到可排序的块只报告不写盘，违规即非零退出。
      - name: import 规范化审计（dart:/package:/相对 三组有序）
        run: >-
          python3 tool/sort_imports.py --dry-run --fatal || echo "FAIL: sort_imports" >> /tmp/strict_failures.txt
        if: always()

      - name: 发布说明文案审查（面向用户 / 无技术词）
        run: >-
          python3 changed/check_content.py --check || echo "FAIL: check_content" >> /tmp/strict_failures.txt
        if: always()

      - name: 静态分析（警告即失败）
        run: >-
          flutter analyze --fatal-infos --fatal-warnings || echo "FAIL: flutter analyze" >> /tmp/strict_failures.txt
        if: always()

      - name: 单元测试（含渲染快照）
        run: >-
          flutter test --reporter expanded || echo "FAIL: flutter test" >> /tmp/strict_failures.txt
        if: always()

      # ── 严格模式终审：收集到的全部失败一次性抛出（fail） ──
      - name: 严格模式终审（全部失败一起 fail）
        if: always()
        # ★ C-13 修复：`N=$(grep -c ... || echo 0)` 有两处缺陷 ——
        #   ① 文件存在但 grep 无匹配时退出码 1，`||` 分支同时再 echo 一个 0，
        #      N 变成 "0\n0"（两个字）；
        #   ② grep 异常退出（权限/二进制）时 `|| echo 0` 会**覆盖** grep 已
        #      输出的真实计数 → 终审静默放行（"静默降级"形状）。
        #   稳健写法：先确保文件存在（空文件占位），grep 计数照常取值，
        #   再对空值兜底为 0；数字合法性由 [ "$N" -gt 0 ] 自身校验。
        run: |
          touch /tmp/strict_failures.txt
          N=$(grep -c 'FAIL:' /tmp/strict_failures.txt 2>/dev/null || true)
          N=${N:-0}
          case "$N" in ''|*[!0-9]*) N=0 ;; esac
          if [ "$N" -gt 0 ]; then
            echo "══════════════════════════════════════"
            echo " 质量门严格模式：共 $N 项失败，全部列出："
            echo "══════════════════════════════════════"
            cat /tmp/strict_failures.txt
            echo "══════════════════════════════════════"
            echo "::error::质量门共 $N 项失败（修复全部后重跑；单项失败不再遮蔽其余问题）"
            exit 1
          else
            echo "✅ 严格模式终审：全部审计通过。"
          fi

      # 渲染快照产物：把主壳在 N 套主题 × N 种屏幕形态下真实渲染成 PNG 上传。
      # 这样"界面到底长什么样"第一次变成可看、可比、可回溯的事实。
      - name: 上传 UI 渲染快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: build/ui_shots/*.png
          if-no-files-found: warn
          retention-days: 14

