name: CI

# 质量门：静态分析 + 单元测试
# 任何 push / PR / 手动触发都会执行；CI 未通过禁止合入。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 质量门（analyze + test）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 环境信息
        run: flutter --version

      - name: 获取依赖
        run: flutter pub get

      # 结构与多语言审计：把「四层依赖方向」「界面文案是否全部本地化」
      # 变成**可执行的门禁**（违反即失败），而不是只写在文档里靠人记。
      - name: 分层审计（依赖只能向下）
        run: python3 tool/layer_audit.py --fatal

      # 版本一致性：`lib/main.dart` 的 kOgLAppVersion 必须与 pubspec 一致。
      # 历史上它长期停留在 7.4.0 而 pubspec 已到 9.x ——「关于」页与诊断日志
      # 谎报版本，构建与发布流程却浑然不知。这条门禁杜绝复发。
      - name: 版本一致性审计（main.dart 与 pubspec 对齐）
        run: python3 tool/version_sync.py

      - name: i18n 审计（界面文案 0 遗漏 / 分片键集合一致）
        run: python3 tool/i18n_scan.py --check

      - name: 动效分级审计（动画必须听档位质量表）
        run: python3 tool/motion_audit.py --fatal

      # ★ UI 细节度门禁：设计令牌之外的字面值一律拦下。
      #   防的是「卡片圆角 2/6/8/12/24 并存」「间距 10/20/28 散落」
      #   「同一角色按钮两处圆角不同」这类**编译器不会报错**的问题。
      - name: UI 细节度门禁（设计令牌一致性）
        run: python3 tool/ui_audit.py --fatal

      - name: 性能反模式审计（shrinkWrap / 宽 MediaQuery.of）
        run: python3 tool/perf_audit.py --fatal

      - name: 图表自检（统计曲线的坐标系 / 刻度 / 降采样）
        run: python3 tool/stats_chart.py --selftest

      # 平台私有文件注入器自检：必须在 CI 里守住"注入不是逃生舱"这条纪律
      # （缺 `why` 的注入项会被拒绝；幂等性也在此验证）。
      - name: 平台注入器自检（幂等 / 缺 why 拒绝）
        run: python3 tool/inject_platform_spec_selftest.py

      # 格式护栏：修「fork 那份 diff 78% 文件被触碰、53% 是空白漂移」类问题。
      # 必须在 analyze 之前跑——空行/缩进不统一会让后续 review 全是噪音。
      # 用 CI 镜像里自带的 `dart format --set-exit-if-changed`（不读
      # `analysis_options.yaml`，避免 flutter_lints 解析失败误杀）。
      # 范围 `lib test`：源码 + widget 测试都要格式化一致。
      - name: 格式护栏（dart format）
        run: dart format --set-exit-if-changed --output=none lib test

      - name: 静态分析（警告即失败）
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 单元测试（含渲染快照）
        run: flutter test --reporter expanded

      # 渲染快照产物：把主壳在 N 套主题 × N 种屏幕形态下真实渲染成 PNG 上传。
      # 这样"界面到底长什么样"第一次变成可看、可比、可回溯的事实。
      - name: 上传 UI 渲染快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: build/ui_shots/*.png
          if-no-files-found: warn
          retention-days: 14

