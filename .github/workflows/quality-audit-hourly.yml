name: Quality Audit

# 每小时定时质量审计：逐个文件审查 lib/（Agnes 高智能），
# 结果 TXT 发布到**独立 tag**（与版本 Release 分开）。
# 用途：把「代码质量趋势」变成可回溯的每小时快照。

on:
  schedule:
    # 每 1 小时触发一次（UTC；北京时间 = UTC+8）
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: quality-audit-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    name: 每小时质量审计（lib/ 逐文件 · Agnes）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 运行质量审计（5 rpm · 逐文件 TXT）
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          OGL_AI_MODEL: agnes-2.5-flash
          OGL_QA_RPM: '5'
        run: python3 tool/ai_quality_audit.py

      - name: 计算北京时间标签
        id: tag
        run: |
          # 用 TZ=Asia/Shanghai 直接取北京时间（UTC+8），避免手算进位
          CN=$(TZ='Asia/Shanghai' date '+%Y%m%d-%H%M')
          echo "tag=CI-cat-${CN}-cst8" >> "$GITHUB_OUTPUT"
          echo "cn=${CN}" >> "$GITHUB_OUTPUT"

      - name: 发布质量审计报告（独立 tag · TXT）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 质量审计 ${{ steps.tag.outputs.cn }}（+8）
          body: |
            每小时质量审计报告（Agnes · 逐文件审查 lib/）。
            Quality audit report (Agnes, per-file review of lib/).
            报告文件：quality_audit.txt
          files: build/quality_audit.txt
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
