name: Web

# Web（JS/Wasm）构建、按版本发布到 `app/`、并更新入口页。
#
# ## 目录约定（见 tool/web_publish.py）
#   app/index.html     入口页：iframe 包裹**当前版本**，地址长期不变
#   app/versions.json  已发布版本清单（新版本在前）
#   app/740/           某版本的完整产物（由本工作流生成并提交）
#
# ## 与五平台发布的关系
# 互不影响：本工作流的成败**不阻塞** build.yml 的五平台发布（两者无 needs 关系）。
# 自 7.0 起 Web 是正式平台之一，因此在 main 与 web 两条分支上都会构建。
#
# ## 启动信任链（Ed25519 引导清单）
# 与 build.yml 同款：CI 从 Secret `OGL_BOOT_KEY` 还原私钥 → 生成签名清单 →
# `--dart-define-from-file` 注入 → `main.dart` 启动时校验签名。
# 没有这一步，release 构建的 `kOgLBootManifestJson` 为空 → 拒绝启动
# （`bootRejected: 引导清单缺失: boot/manifest.json`）。

on:
  push:
    branches: [web, main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build-web:
    name: 构建并发布 Web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装签名依赖
        run: python3 -m pip install --quiet --disable-pip-version-check cryptography

      # ★ 私钥不随仓库保管：从 Secret `OGL_BOOT_KEY` 还原到 runner 临时目录。
      - name: 还原签名私钥（Actions Secret）
        env:
          OGL_BOOT_KEY: ${{ secrets.OGL_BOOT_KEY }}
        run: |
          [ -n "$OGL_BOOT_KEY" ] || { echo '缺少 OGL_BOOT_KEY Secret（见 .github/signing/README.md）'; exit 1; }
          printf '%s' "$OGL_BOOT_KEY" > "$RUNNER_TEMP/ogl-boot-ed25519.key"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 取依赖
        run: flutter pub get

      # 平台目录不提交，由 CI 现场生成。web/ 已在仓库里（PWA 脚手架 + 图标），
      # `flutter create` 只补齐缺失项，不覆盖已有文件。
      - name: 生成平台目录
        run: flutter create --platforms=web --org com.yingo --project-name ohgithublost .

      - name: 生成并注入 .dart_define.json（Ed25519 签名引导清单）
        env:
          VERSION_INPUT: ${{ inputs.version_name }}
        run: |
          python3 tool/boot_manifest.py \
            --version "${{ github.ref_name }}" \
            --build-id "$GITHUB_SHA" \
            --key "$RUNNER_TEMP/ogl-boot-ed25519.key" \
            --out dart_define.json

      # ── 为什么要 dart2wasm 而不是 dart2js ───────────────────────────────
      # dart2js 输出 main.dart.js ≈ 5.2 MB（gzip 后仍 1.7 MB），浏览器
      # 必须先下载、再 parse、再 JIT-like 执行，**首次可交互** 受三者拖累。
      # dart2wasm 输出 main.dart.wasm（通常 < 1 MB，gzip ≈ 600 KB），
      # 浏览器可以直接流式编译 + AOT 风格的常量池就地初始化 —— 同等网速
      # 下首次加载减少 50%~70%。`flutter_bootstrap.js` 在编译期注入，
      # 会自动嗅探 WebAssembly 支持并降级到 js（旧浏览器 / IE 路径）。
      # 当前产物为 wasm 主载 + dart2js fallback 双发，**不删除** main.dart.js。
      - name: 构建（release，dart2wasm 优化首次加载）
        run: >-
          flutter build web --release --wasm
          --dart-define-from-file=dart_define.json

      - name: 读出版本号
        id: ver
        run: |
          set -eu
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - name: 按版本发布到 app/
        run: python3 tool/web_publish.py build/web "${{ steps.ver.outputs.version }}"

      - name: 上传产物（便于排查）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ogl-web
          path: build/web
          if-no-files-found: warn
          retention-days: 14

      # 提交回分支：app/ 下的版本目录与入口页需要长期可访问。
      # 提交信息带 [skip ci]，避免本工作流自己触发自己。
      - name: 提交 app/
        run: |
          set -eu
          git config user.name  'ogl-web-bot'
          git config user.email 'ogl-web-bot@users.noreply.github.com'
          git add -A app
          if git diff --cached --quiet; then
            echo 'app/ 无变化，跳过提交'
            exit 0
          fi
          git commit -m "chore(web): 发布 ${{ steps.ver.outputs.version }} 到 app/ [skip ci]"
          git push
