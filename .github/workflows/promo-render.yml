name: Promo Render

# ============================================================================
# OGL 宣传片 · 代码渲染管线
#
# 本地（任意架构）：只写 HTML/CSS/GSAP、音轨、分镜与静态 lint。
# CI（ubuntu-latest x64）：装 Chrome Headless Shell，逐帧渲染 MP4 + 混音，
#                          用 7-Zip 极限压缩打进 tag / Release，并上传 artifact。
#
# 分支：video（宣传片工程专用分支）；main 上 promo/ 变更也会触发。
# ============================================================================

on:
  push:
    branches: [video, main, 'promo/**']
    paths:
      - 'promo/**'
      - '.github/workflows/promo-render.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '渲染完成后发布到 GitHub Release'
        type: boolean
        default: false

concurrency:
  group: promo-render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HYPERFRAMES_TELEMETRY: '0'
  HF_VERSION: '0.9.46'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 片中大量中文/俄文/德文文案；GitHub runner 默认无 CJK 字体，
      # 不装会渲染成豆腐块。ffmpeg/ffprobe 供 HyperFrames 编码与探测使用
      # （ubuntu-latest 镜像不保证预装，首轮渲染即因缺它失败）。
      - name: Install CJK fonts & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji ffmpeg p7zip-full
          fc-cache -f
          fc-list :lang=zh | head -3
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Cache HyperFrames CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: hf-npm-${{ runner.os }}-${{ env.HF_VERSION }}-v1

      - name: Install HyperFrames CLI & Chrome
        run: |
          npx -y "hyperframes@${HF_VERSION}" --version
          npx -y "hyperframes@${HF_VERSION}" browser ensure

      # 主音轨是 Wordless 裁段（版权素材，不重算）；备用合成轨仍需可复现。
      # 校验三件事：两轨存在、主轨 56s 可解码、备用轨与脚本逐字节一致。
      - name: Verify audio assets
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy
          test -s promo/assets/audio/wordless-56s.mp3
          test -s promo/assets/audio/bgm.wav
          DUR=$(ffprobe -v error -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 \
                promo/assets/audio/wordless-56s.mp3)
          python3 - "$DUR" <<'PY'
          import sys
          d = float(sys.argv[1])
          assert 55.5 <= d <= 56.5, f"主音轨时长 {d}s 不在 56s ±0.5s 内"
          print(f"Wordless 主音轨：{d:.3f}s，OK")
          PY
          cp promo/assets/audio/bgm.wav /tmp/bgm-committed.wav
          python3 promo/scripts/make_bgm.py
          cmp /tmp/bgm-committed.wav promo/assets/audio/bgm.wav \
            && echo "备用合成 BGM 逐字节复现 OK" \
            || { echo "::error::备用 BGM 与提交产物不一致"; exit 1; }
          ls -lh promo/assets/audio/

      - name: Lint composition (strict gate)
        working-directory: promo
        run: |
          npx -y "hyperframes@${HF_VERSION}" lint --json . > ../lint.json 2>&1 || true
          python3 - <<'PY'
          import json, sys
          raw = open('../lint.json', encoding='utf-8').read()
          try:
              d = json.loads(raw[raw.index('{'): raw.rindex('}') + 1])
          except Exception:
              print('::error::lint 输出无法解析为 JSON')
              print(raw[:2000])
              sys.exit(1)
          errs = d.get('errorCount', 0)
          warns = d.get('warningCount', 0)
          print(f'lint: {errs} errors, {warns} warnings')
          for f in d.get('findings', []):
              print(' ', f.get('severity'), f.get('code'), f.get('selector') or '')
          if errs:
              sys.exit(1)
          PY

      # 运行时/布局/对比度检查需要起浏览器，结果作为诊断上传；
      # 仅静态 lint 的 error 级别作为硬门禁，避免环境差异误杀渲染。
      - name: Runtime check (advisory)
        working-directory: promo
        continue-on-error: true
        run: |
          npx -y "hyperframes@${HF_VERSION}" check --json . \
            --budget 5m --samples 9 > ../check.json 2>&1 || true
          python3 - <<'PY'
          import json
          raw = open('../check.json', encoding='utf-8').read()
          try:
              d = json.loads(raw[raw.index('{'): raw.rindex('}') + 1])
              print('check ok =', d.get('ok'))
              for k in ('errorCount', 'warningCount', 'issueCount', 'status', 'summary'):
                  if k in d: print(k, '=', d[k])
              for key in ('errors', 'violations', 'issues', 'findings'):
                  items = d.get(key) or []
                  if isinstance(items, list) and items:
                      print(f'-- {key}: {len(items)}')
                      for it in items[:15]:
                          if isinstance(it, dict):
                              print('  ', it.get('severity'), it.get('code'),
                                    it.get('selector') or '', str(it.get('message',''))[:160])
                          else:
                              print('  ', str(it)[:160])
          except Exception:
              print(raw[:3000])
          PY

      - name: Render MP4
        run: |
          mkdir -p promo/final
          npx -y "hyperframes@${HF_VERSION}" render promo \
            --output promo/final/OGL-Promo.mp4 \
            --fps 30 \
            --workers 4 \
            --no-browser-gpu
          ls -lh promo/final/
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 promo/final/OGL-Promo.mp4

      - name: Generate contact sheet
        run: |
          ffmpeg -y -i promo/final/OGL-Promo.mp4 -vf \
            "fps=1/6,scale=480:-1,tile=3x3" -frames:v 1 \
            promo/final/contact-sheet.jpg
          ls -lh promo/final/contact-sheet.jpg

      - name: Package with 7-Zip (maximum compression)
        run: |
          set -euo pipefail
          mkdir -p promo/final/package
          cp promo/final/OGL-Promo.mp4 \
             promo/final/contact-sheet.jpg \
             lint.json check.json \
             promo/04-edl.md promo/05-delivery.md \
             promo/final/package/
          # -mx=9 极限压缩；-m0=LZMA2 -md=64m 提高字典；-mmt=on 多核
          7z a -t7z -mx=9 -m0=LZMA2 -md=64m -mmt=on -bd \
             promo/final/OGL-Promo.7z ./promo/final/package/*
          ls -lh promo/final/OGL-Promo.mp4 promo/final/OGL-Promo.7z
          7z t promo/final/OGL-Promo.7z -bd | tail -3
          # 便于下游直接取用与对比
          sha256sum promo/final/OGL-Promo.mp4 promo/final/OGL-Promo.7z \
            | tee promo/final/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ogl-promo-${{ github.ref_name }}-${{ github.sha }}
          path: |
            promo/final/OGL-Promo.mp4
            promo/final/OGL-Promo.7z
            promo/final/contact-sheet.jpg
            promo/final/SHA256SUMS.txt
            lint.json
            check.json
          retention-days: 30

      # 每次 video 分支成功渲染都打一个轻量 tag 并发布 Release；
      # 手动触发时保留 publish_release 开关作为显式控制。
      - name: Publish to Release & tag
        if: ${{ github.ref == 'refs/heads/video' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="promo-${GITHUB_SHA::7}"
          git config user.name "OGL Promo Bot"
          git config user.email "promo@users.noreply.github.com"
          git tag -a "$TAG" -m "OGL 宣传片 $TAG · 代码渲染 + Wordless 卡点"
          git push origin "$TAG"
          gh release create "$TAG" \
            promo/final/OGL-Promo.7z \
            promo/final/OGL-Promo.mp4 \
            promo/final/contact-sheet.jpg \
            promo/final/SHA256SUMS.txt \
            --title "OGL 宣传片 $TAG" \
            --notes "由 .github/workflows/promo-render.yml 从 promo/ 源码自动渲染。

          - 56s / 30fps / 1920x1080，HOYO-MiX《子不语 Wordless》卡点混音
          - 5 张 Android 实机截图，面向新手开发者与尝鲜极客
          - OGL-Promo.7z：7-Zip -mx=9 极限压缩包（含成片、联系表、EDL、校验）
          - OGL-Promo.mp4：可直接播放的成片
          - SHA256SUMS.txt：完整性校验"
