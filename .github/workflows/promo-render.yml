name: Promo Render

# ============================================================================
# OGL 片尾 · HF 0.9.46 + GSAP 单根 HTML 2D 电影片尾
#
# 零图纯文字、黑体居中、连续匀速上滚、无边框无装饰线。
# 片长由《燕辞归》175.082s 决定，不裁切、不补帧。
# ============================================================================

on:
  push:
    branches: [video, main, 'promo/**']
    paths:
      - 'promo/**'
      - '.github/workflows/promo-render.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '渲染完成后发布到 GitHub Release'
        type: boolean
        default: false

concurrency:
  group: promo-render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HYPERFRAMES_TELEMETRY: '0'
  HF_VERSION: '0.9.46'
  PROMO_DURATION: '175.082'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 成片只用本地 OGLHeiti 子集，不再安装系统 CJK 字体；
      # ffmpeg/ffprobe 与 p7zip 在 ubuntu-latest 镜像里通常已具备，仅做探测，缺了才装。
      - name: Ensure FFmpeg & 7-Zip
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && command -v 7z >/dev/null; then
            echo "ffmpeg / ffprobe / 7z already present — skip apt-get"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg p7zip-full
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: hf-npm-${{ runner.os }}-${{ env.HF_VERSION }}-v2

      - name: Install HyperFrames CLI & Chrome
        run: |
          npx -y "hyperframes@${HF_VERSION}" --version
          npx -y "hyperframes@${HF_VERSION}" browser ensure

      - name: Verify audio, fonts and zero-image sources
        run: |
          set -euo pipefail
          AUDIO=promo/assets/audio/yancigui-25.m4a
          test -s "$AUDIO"
          DUR=$(ffprobe -v error -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 "$AUDIO")
          python3 - "$DUR" "${PROMO_DURATION}" <<'PY'
          import sys
          d, target = float(sys.argv[1]), float(sys.argv[2])
          assert abs(d - target) <= 0.5, f"音轨时长 {d}s 不是 {target}s ±0.5s"
          print(f"yancigui-25.m4a: {d:.3f}s · 片长锁 {target:.3f}s")
          PY
          for f in \
            promo/assets/fonts/heiti-subset.woff2 \
            promo/assets/vendor/gsap.min.js \
            promo/index.html \
            promo/compositions/credits.html \
            promo/data/milestones.json ; do
            test -s "$f" || { echo "::error::缺源文件 $f"; exit 1; }
          done
          echo "2D 源文件齐备"
          IMAGES=$(find promo -type f \
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \
               -o -iname '*.svg' -o -iname '*.webp' -o -iname '*.gif' \) \
            -print)
          if [ -n "$IMAGES" ]; then
            echo "::error::零图约束被破坏，promo/ 下发现图片文件："
            echo "$IMAGES"
            exit 1
          fi
          echo "zero-image gate: promo/ 下无 png/jpg/jpeg/svg/webp/gif"

      - name: Lint composition (strict gate)
        working-directory: promo
        run: |
          npx -y "hyperframes@${HF_VERSION}" lint --json . > ../lint.json 2>&1 || true
          python3 - <<'PY'
          import json, sys
          raw = open('../lint.json', encoding='utf-8').read()
          try:
              d = json.loads(raw[raw.index('{'): raw.rindex('}') + 1])
          except Exception:
              print('::error::lint 输出无法解析为 JSON')
              print(raw[:2000])
              sys.exit(1)
          errs = d.get('errorCount')
          if not isinstance(errs, int):
              print('::error::lint 输出缺少 errorCount')
              print(raw[:2000])
              sys.exit(1)
          warns = d.get('warningCount', 0)
          print(f'lint: {errs} errors, {warns} warnings')
          for key in ('findings', 'warnings'):
              items = d.get(key)
              if not isinstance(items, list):
                  continue
              for f in items:
                  if isinstance(f, dict):
                      sev = str(f.get('severity') or f.get('level') or '')
                      if key == 'warnings' or 'warn' in sev.lower():
                          print('  warning:', f.get('code') or key,
                                f.get('selector') or '',
                                str(f.get('message', ''))[:140])
                  else:
                      print('  warning:', str(f)[:200])
          if errs != 0:
              print('::error::lint 硬门禁：errorCount 必须为 0')
              sys.exit(1)
          print('lint gate: errorCount == 0')
          PY

      - name: Runtime check (advisory)
        working-directory: promo
        continue-on-error: true
        run: |
          npx -y "hyperframes@${HF_VERSION}" check --json . \
            --budget 5m --samples 6 > ../check.json 2>&1 || true
          python3 - <<'PY'
          import json
          raw = open('../check.json', encoding='utf-8').read()
          try:
              d = json.loads(raw[raw.index('{'): raw.rindex('}') + 1])
              print('check ok =', d.get('ok'))
              for key in ('errors', 'violations', 'issues', 'findings'):
                  items = d.get(key) or []
                  if isinstance(items, list) and items:
                      print(f'-- {key}: {len(items)}')
                      for it in items[:10]:
                          if isinstance(it, dict):
                              print('  ', it.get('severity'), it.get('code'),
                                    str(it.get('message',''))[:140])
          except Exception:
              print(raw[:2500])
          PY

      - name: Render MP4 (delivery 1080p)
        run: |
          set -euo pipefail
          mkdir -p promo/final
          npx -y "hyperframes@${HF_VERSION}" render promo \
            --output promo/final/OGL-Credits.mp4 \
            --fps 30 \
            --workers 4 \
            --no-browser-gpu
          ls -lh promo/final/
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 promo/final/OGL-Credits.mp4
          DUR=$(ffprobe -v error -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 promo/final/OGL-Credits.mp4)
          python3 - "$DUR" "${PROMO_DURATION}" <<'PY'
          import sys
          d, target = float(sys.argv[1]), float(sys.argv[2])
          assert abs(d - target) <= 0.5, f"成片时长 {d}s 偏离 {target}s 超过 0.5s"
          print(f"render duration gate: {d:.3f}s ≈ {target:.3f}s")
          PY

      - name: Derive 720p lightweight cut
        run: |
          set -euo pipefail
          ffmpeg -y -v error -i promo/final/OGL-Credits.mp4 \
            -vf "scale=1280:720:flags=lanczos" \
            -c:v libx264 -preset slow -crf 23 -profile:v high -level 4.0 \
            -c:a aac -b:a 128k -movflags +faststart \
            promo/final/OGL-Credits-720p.mp4
          ls -lh promo/final/*.mp4

      - name: Generate contact sheet (3x3, full 98s)
        run: |
          set -euo pipefail
          # 时间轴归一化到 ~160s 后按 fps=1/18 取 9 帧，使 3x3 网格覆盖整段 175.082s
          ffmpeg -y -v error -i promo/final/OGL-Credits.mp4 -an -vf \
            "setpts=0.91*(PTS-STARTPTS),fps=1/18,scale=480:-1,tile=3x3" \
            -frames:v 1 -q:v 3 promo/final/contact-sheet.jpg
          test -s promo/final/contact-sheet.jpg
          ls -lh promo/final/contact-sheet.jpg

      - name: Package with 7-Zip (maximum compression)
        run: |
          set -euo pipefail
          mkdir -p promo/final/package
          cp promo/final/OGL-Credits.mp4 \
             promo/final/OGL-Credits-720p.mp4 \
             promo/final/contact-sheet.jpg \
             lint.json check.json \
             promo/01-brief.md promo/02-storyboard.md \
             promo/04-edl.md promo/05-delivery.md \
             promo/06-music-plan.md promo/07-motion.md \
             promo/final/package/
          7z a -t7z -mx=9 -m0=LZMA2 -md=64m -mmt=on -bd \
             promo/final/OGL-Credits.7z ./promo/final/package/*
          7z t promo/final/OGL-Credits.7z -bd | tail -3
          sha256sum promo/final/OGL-Credits.mp4 \
            promo/final/OGL-Credits-720p.mp4 \
            promo/final/contact-sheet.jpg \
            promo/final/OGL-Credits.7z | tee promo/final/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ogl-credits-2d-${{ github.ref_name }}-${{ github.sha }}
          path: |
            promo/final/OGL-Credits.mp4
            promo/final/OGL-Credits-720p.mp4
            promo/final/OGL-Credits.7z
            promo/final/contact-sheet.jpg
            promo/final/SHA256SUMS.txt
            lint.json
            check.json
          retention-days: 30

      - name: Publish to Release & tag
        if: ${{ github.ref == 'refs/heads/video' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="promo-${GITHUB_SHA::7}"
          git config user.name "OGL Promo Bot"
          git config user.email "promo@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，复用"
          else
            git tag -a "$TAG" -m "OGL 2D 电影片尾 $TAG"
            git push origin "$TAG"
          fi
          cat > /tmp/RELEASE_NOTES.md <<'NOTES'
          由 .github/workflows/promo-render.yml 从 promo/ 源码自动渲染。

          - 2D 电影片尾 / 16 条版本区间 / 黑体居中上滚 / 零图纯文字 / 燕辞归 25% / 175.082s
          - HF 0.9.46 + GSAP 单根 HTML 合成，30fps；版本区间置于内容正上方
          - OGL-Credits-720p.mp4：CRF23 轻量版；OGL-Credits.7z：-mx=9 极限压缩包
          - contact-sheet.jpg：3x3 全片采样；SHA256SUMS.txt：完整性校验

          > 音轨版权归原权利人，仅随 video 分支用于内部样片。
          NOTES
          ASSETS="promo/final/OGL-Credits.7z promo/final/OGL-Credits.mp4 \
                  promo/final/OGL-Credits-720p.mp4 promo/final/contact-sheet.jpg \
                  promo/final/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --title "OGL 片尾 $TAG · 2D 电影片尾" \
              --notes-file /tmp/RELEASE_NOTES.md
          fi
