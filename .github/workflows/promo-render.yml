name: Promo Render

# ============================================================================
# OGL 宣传片 · Three.js 一镜到底渲染管线
#
# 本地：写 HTML / Three.js / 面板贴图 / BGM / 文档，跑静态 lint。
# CI：ubuntu-latest x64 官方 Chrome 逐帧渲染 WebGL → MP4 → 720p → 7z → tag。
#
# 片长由 BGM 决定：HOYO-MiX《月宫试云衣》完整 175.01s，不裁切。
# ============================================================================

on:
  push:
    branches: [video, main, 'promo/**']
    paths:
      - 'promo/**'
      - '.github/workflows/promo-render.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '渲染完成后发布到 GitHub Release'
        type: boolean
        default: false

concurrency:
  group: promo-render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HYPERFRAMES_TELEMETRY: '0'
  HF_VERSION: '0.9.46'
  PROMO_DURATION: '175.01'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install fonts, FFmpeg, 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji ffmpeg p7zip-full
          fc-cache -f
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Cache HyperFrames CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: hf-npm-${{ runner.os }}-${{ env.HF_VERSION }}-v1

      - name: Install HyperFrames CLI & Chrome
        run: |
          npx -y "hyperframes@${HF_VERSION}" --version
          npx -y "hyperframes@${HF_VERSION}" browser ensure

      - name: Verify BGM length and 3D assets
        run: |
          set -euo pipefail
          AUDIO=promo/assets/audio/bgm-lunar.mp3
          test -s "$AUDIO"
          DUR=$(ffprobe -v error -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 "$AUDIO")
          python3 - "$DUR" <<'PY'
          import sys
          d = float(sys.argv[1])
          assert 174.5 <= d <= 175.5, f"BGM 时长 {d}s 不是 175.01s ±0.5s"
          print(f"bgm-lunar.mp3: {d:.3f}s · 片长锁 {d:.2f}s")
          PY
          test -s promo/assets/one-shot.js
          test -s promo/assets/three/three.module.min.js
          test -s promo/assets/three/three.core.min.js
          for i in $(seq -w 0 10); do test -s "promo/assets/panels/panel-${i}.png"; done
          missing=0
          for f in $(grep -rhoE 'assets/(screens|panels)/[0-9a-z-]+\.(png|jpg)' promo/assets/one-shot.js promo/index.html | sort -u); do
            if [ ! -s "promo/$f" ]; then echo "::error::缺素材 promo/$f"; missing=1; fi
          done
          [ "$missing" = "0" ] && echo "3D 素材引用均存在"
          ls -lh "$AUDIO" promo/assets/one-shot.js promo/assets/panels/ | tail -14

      - name: Lint composition (strict gate)
        working-directory: promo
        run: |
          npx -y "hyperframes@${HF_VERSION}" lint --json . > ../lint.json 2>&1 || true
          python3 - <<'PY'
          import json, sys
          raw = open('../lint.json', encoding='utf-8').read()
          try:
              d = json.loads(raw[raw.index('{'): raw.rindex('}') + 1])
          except Exception:
              print('::error::lint 输出无法解析为 JSON')
              print(raw[:2000])
              sys.exit(1)
          errs = d.get('errorCount', 0)
          warns = d.get('warningCount', 0)
          print(f'lint: {errs} errors, {warns} warnings')
          for f in d.get('findings', []):
              print(' ', f.get('severity'), f.get('code'), f.get('selector') or '')
          if errs:
              sys.exit(1)
          PY

      - name: Runtime check (advisory)
        working-directory: promo
        continue-on-error: true
        run: |
          npx -y "hyperframes@${HF_VERSION}" check --json . \
            --budget 8m --samples 6 > ../check.json 2>&1 || true
          python3 - <<'PY'
          import json
          raw = open('../check.json', encoding='utf-8').read()
          try:
              d = json.loads(raw[raw.index('{'): raw.rindex('}') + 1])
              print('check ok =', d.get('ok'))
              for key in ('errors', 'violations', 'issues', 'findings'):
                  items = d.get(key) or []
                  if isinstance(items, list) and items:
                      print(f'-- {key}: {len(items)}')
                      for it in items[:10]:
                          if isinstance(it, dict):
                              print('  ', it.get('severity'), it.get('code'),
                                    str(it.get('message',''))[:140])
          except Exception:
              print(raw[:2500])
          PY

      - name: Render MP4 (delivery 1080p)
        run: |
          mkdir -p promo/final
          npx -y "hyperframes@${HF_VERSION}" render promo \
            --output promo/final/OGL-Promo.mp4 \
            --fps 30 \
            --workers 4 \
            --no-browser-gpu
          ls -lh promo/final/
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 promo/final/OGL-Promo.mp4

      - name: Derive 720p lightweight cut
        run: |
          set -euo pipefail
          ffmpeg -y -v error -i promo/final/OGL-Promo.mp4 \
            -vf "scale=1280:720:flags=lanczos" \
            -c:v libx264 -preset slow -crf 23 -profile:v high -level 4.0 \
            -c:a aac -b:a 128k -movflags +faststart \
            promo/final/OGL-Promo-720p.mp4
          ls -lh promo/final/*.mp4

      - name: Generate contact sheet
        run: |
          ffmpeg -y -i promo/final/OGL-Promo.mp4 -vf \
            "fps=1/20,scale=480:-1,tile=3x3" -frames:v 1 \
            promo/final/contact-sheet.jpg

      - name: Package with 7-Zip (maximum compression)
        run: |
          set -euo pipefail
          mkdir -p promo/final/package
          cp promo/final/OGL-Promo.mp4 \
             promo/final/OGL-Promo-720p.mp4 \
             promo/final/contact-sheet.jpg \
             lint.json check.json \
             promo/01-brief.md promo/02-storyboard.md \
             promo/04-edl.md promo/05-delivery.md \
             promo/06-music-plan.md promo/07-motion.md \
             promo/final/package/
          7z a -t7z -mx=9 -m0=LZMA2 -md=64m -mmt=on -bd \
             promo/final/OGL-Promo.7z ./promo/final/package/*
          7z t promo/final/OGL-Promo.7z -bd | tail -3
          sha256sum promo/final/OGL-Promo.mp4 promo/final/OGL-Promo-720p.mp4 \
            promo/final/OGL-Promo.7z | tee promo/final/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ogl-promo-3d-${{ github.ref_name }}-${{ github.sha }}
          path: |
            promo/final/OGL-Promo.mp4
            promo/final/OGL-Promo-720p.mp4
            promo/final/OGL-Promo.7z
            promo/final/contact-sheet.jpg
            promo/final/SHA256SUMS.txt
            lint.json
            check.json
          retention-days: 30

      - name: Publish to Release & tag
        if: ${{ github.ref == 'refs/heads/video' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="promo-${GITHUB_SHA::7}"
          git config user.name "OGL Promo Bot"
          git config user.email "promo@users.noreply.github.com"
          git tag -a "$TAG" -m "OGL 宣传片 $TAG · Three.js 一镜到底"
          git push origin "$TAG"
          gh release create "$TAG" \
            promo/final/OGL-Promo.7z \
            promo/final/OGL-Promo.mp4 \
            promo/final/OGL-Promo-720p.mp4 \
            promo/final/contact-sheet.jpg \
            promo/final/SHA256SUMS.txt \
            --title "OGL 宣传片 $TAG · 3D 一镜到底" \
            --notes "由 .github/workflows/promo-render.yml 从 promo/ 源码自动渲染。

          - 175.01s / 30fps / 1920x1080，片长由 HOYO-MiX《月宫试云衣》完整曲目决定
          - 单个 Three.js 相机连续飞行：11 个功能站点、零切镜、零黑场
          - 亮色 Material 3 长廊，中文面板为烘焙贴图，12 张实机截图作为 3D 平面
          - OGL-Promo-720p.mp4：轻量版；OGL-Promo.7z：-mx=9 极限压缩包
          - SHA256SUMS.txt：完整性校验

          > 音轨版权归原权利人，仅随 video 分支用于内部样片。"