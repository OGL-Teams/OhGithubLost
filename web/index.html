<!DOCTYPE html>
<!--
  OGL Web 入口页（PWA）。

  ## 为什么手写而不是用 flutter create 的模板
  `flutter create` 生成的 index.html 只有最基本的一组标签。要让 Web 版可以
  「添加到主屏幕 / 添加到程序坞」，还需要 PWA 清单与一组 apple-* 标签 ——
  而这些**平台差异主要在 iOS Safari**：它不支持 `beforeinstallprompt`，
  只能靠用户手动「共享 → 添加到主屏幕」，页面侧能做的是把那组标签写对
  （apple-mobile-web-app-capable 决定全屏、apple-touch-icon 决定图标），
  并在代码里给出对应指引。macOS 上 Safari 16+ 与 Chrome/Edge 行为一致，
  走标准 beforeinstallprompt；Safari 也支持「添加到程序坞」。

  ## CanvasKit 延迟加载
  Flutter 3.x（≥3.22）默认 CanvasKit 渲染器在首次有 Canvas 需要绘制时
  才下载 canvaskit.wasm / canvaskit.js（~3 MB），首屏 HTML 不再同步加载，
  这一行为由 flutter_bootstrap.js 控制（Flutter 构建时生成，不在源码树里）。
  本文件不引入任何 canvaskit_*.js 同步脚本，避免与上述默认行为冲突。
  老的 Flutter 2.x 模板里直接 <script src="canvaskit_web.js"> 的写法在这里
  不再适用（那个文件本身在 Flutter 3.x 已不存在）。

  ## 图标
  与其他平台同源：`assets/icon/ogl_icon.svg` 经 tool/desktop_icon.py 光栅化。
-->
<html lang="zh">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>OhGithubLost</title>
  <meta name="description" content="OGL · OhGithubLost — GitHub 仓库管理器（Web 版）">

  <!-- ── PWA：让浏览器允许「安装 / 添加到主屏幕」 ───────────────────── -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#171A21">

  <!-- ── iOS Safari：这些是 iOS 上「添加到主屏幕」的实际开关 ────────── -->
  <!--   -capable=yes  → 以独立窗口打开（不带 Safari 地址栏）
       -status-bar-style → 状态栏样式
       -title         → 主屏图标下方显示的名字
       apple-touch-icon → iOS **不读** manifest 里的 icons，只认这个标签 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OGL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <!-- ── 资源加载：同源优先，失败才降级到镜像 ──────────────────────────
       站点与产物同域，浏览器可直接复用同一条连接与 HTTP/2 多路复用。

       历史教训：v9.5.0 之前这里会并行探测三个镜像（各 1 s 超时），
       按 13 KB 的探针结果挑选"最快"者。探针只测小文件首包延迟，
       与大文件吞吐完全无关——实测被选中的镜像下载 1.4 MB 主包只有
       8 KB/s，主包要下 3 分钟，表现为"网络迟迟不结束、进不了主界面"。
       同源实测 1.4 MB / 5.8 s，是探针结果的百倍。

       因此：默认同源、不做任何探测（零额外延迟）；只有同源的
       flutter_bootstrap.js 加载失败时才降级到镜像。 -->
  <script>
    (function () {
      var MIRROR = 'https://fastly.jsdelivr.net/gh/OGL-Teams/OhGithubLost@web/app/';

      // 当前桶（'wasm' | 'js'）：从路径推导，模板里不写死版本。
      // 页面自身的 <base> 已指向桶目录，故同源资源一律用相对路径；
      // 只有降级到镜像时才需要拼出完整桶路径。
      var bucket = location.pathname;
      var suffix = bucket.replace(/^\/+/, '');
      if (suffix.indexOf('app/') === 0) suffix = suffix.slice(4);
      if (suffix.slice(-1) !== '/') suffix = suffix.replace(/[^/]*$/, '');
      var isWasm = suffix.indexOf('wasm/') === 0;

      // 预取关键产物：与 flutter_bootstrap.js 并行下载，省掉串行等待。
      // 只预取本桶实际存在的那一份（wasm 桶没有 main.dart.js，反之亦然）。
      function preload(href, as) {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = as;
        l.href = href;
        document.head.appendChild(l);
      }
      // 只预取主包。canvaskit 有 full / chromium 两个变体，具体用哪一个是
      // flutter_bootstrap 按浏览器能力决定的；提前预取会命中错误的那一份，
      // 结果同一份 wasm 被下载两次（实测多出 1.9 MB，冷启动多等一倍）。
      if (isWasm) {
        preload('main.dart.wasm', 'fetch');
      } else {
        preload('main.dart.js', 'script');
      }

      function start(base) {
        var s = document.createElement('script');
        // base 为空 = 同源（相对当前桶）；否则为镜像根，需补桶路径。
        s.src = (base ? base + suffix : '') + 'flutter_bootstrap.js';
        s.async = true;
        return s;
      }

      var first = start('');
      first.addEventListener('error', function () {
        console.warn('同源加载失败，降级到镜像');
        document.body.appendChild(start(MIRROR));
      });
      document.body.appendChild(first);
    })();
  </script>
</body>
</html>
